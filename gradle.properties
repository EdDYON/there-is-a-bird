# Gradle runtime
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Minecraft / Forge environment
minecraft_version=1.20.1
forge_version=47.2.0
mapping_channel=parchment
mapping_version=2023.09.03-1.20.1

# Mod metadata
mod_id=guaniao
mod_name=Bird Watching
mod_version=1.0.0
mod_group_id=EdDYON.guaniao
mod_authors=EdDYON
mod_description=\u6211\u53bb\uff01\u54ea\u6765\u7684\u9e1f\uff1f
geckolib_version=4.4.9

# Preserve the local proxy environment from the previous workspace.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897

# ForgeGradle can fail its own certificate pre-check behind local proxies.
# This is equivalent to running Gradle with:
# -Dnet.minecraftforge.gradle.check.certs=false
systemProp.net.minecraftforge.gradle.check.certs=false
