plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-neoforge-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

sourceSets {
    main.resources.srcDir 'src/generated/resources'
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            systemProperty 'geckolib.disable_examples', 'true'
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
    runs.configureEach { loadedMods = [mods[mod_id]] }
}

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}
dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

tasks.named('processResources') {
    inputs.property('mod_version', project.mod_version)
    filesMatching('META-INF/neoforge.mods.toml') { expand mod_version: project.mod_version }
}

tasks.named('jar', Jar) {
    exclude '**/*.html', '**/*.htm', '**/*.css', '**/*.js', '**/*.map'
    manifest.attributes([
        'Specification-Title': mod_name,
        'Specification-Vendor': mod_authors,
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Implementation-Vendor': mod_authors
    ])
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            artifact tasks.named('jar')
            artifact tasks.named('sourcesJar')
        }
    }
    repositories {
        maven { url = uri('mcmodsrepo') }
    }
}

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Checks NeoForge metadata, resources, mixins, and isolation of runtime tests.'
    dependsOn 'jar'
    doLast {
        def archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        new java.util.jar.JarFile(archive).withCloseable { jarFile ->
            if (jarFile.manifest.mainAttributes.getValue('Implementation-Version') != project.version.toString()) {
                throw new GradleException('Release JAR version does not match mod_version')
            }
            def metadata = jarFile.getJarEntry('META-INF/neoforge.mods.toml')
            if (metadata == null) throw new GradleException('NeoForge mod metadata missing')
            def toml = jarFile.getInputStream(metadata).withCloseable { it.getText('UTF-8') }
            if (!toml.contains('version="' + project.version + '"') || !toml.contains('config="guaniao.mixins.json"')
                    || !toml.contains('enumExtensions="META-INF/enumextensions.json"')) {
                throw new GradleException('Version, Mixin or camera arm pose registration missing')
            }
            def readJson = { String name ->
                def entry = jarFile.getJarEntry(name)
                if (entry == null) throw new GradleException("Release JAR is missing ${name}")
                jarFile.getInputStream(entry).withCloseable { stream -> new groovy.json.JsonSlurper().parse(stream, 'UTF-8') }
            }
            def mixins = readJson('guaniao.mixins.json')
            mixins.mixins.each { name ->
                if (jarFile.getJarEntry("${mixins.package.replace('.', '/')}/${name}.class") == null) {
                    throw new GradleException("Missing Mixin class: ${name}")
                }
            }
            ['data/guaniao/recipe/nikon_d750.json', 'data/guaniao/enchantment/burial_plume.json',
             'data/guaniao/enchantment/riven_plume.json', 'data/guaniao/enchantment/hunting_return.json',
             'data/guaniao/jukebox_song/uwu_funk.json', 'data/guaniao/neoforge/biome_modifier/bird_spawns.json',
             'data/neoforge/loot_modifiers/global_loot_modifiers.json', 'META-INF/enumextensions.json'].each { readJson(it) }
            int jsonCount = 0
            jarFile.entries().each { entry ->
                if (entry.name.contains('/porttest/') || entry.name.startsWith('data/guaniao_port_tests/')
                        || entry.name == 'META-INF/mods.toml') throw new GradleException("Unexpected test/Forge file: ${entry.name}")
                if (!entry.directory && entry.name.endsWith('.json')) { readJson(entry.name); jsonCount++ }
            }
            logger.lifecycle("Verified NeoForge release JAR: ${archive.name}; ${jsonCount} JSON resources")
        }
    }
}

tasks.named('check') { dependsOn 'verifyReleaseJar' }
