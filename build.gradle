buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
        classpath group: 'org.parchmentmc', name: 'librarian', version: '1.+', changing: true
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'geckolib.disable_examples', 'true'

            mods {
                create(mod_id) {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
        }

        server {
            workingDirectory project.file('run/server')
        }

        gameTestServer {
            workingDirectory project.file('run/testServer')
        }

        data {
            workingDirectory project.file('run/data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, 'guaniao.refmap.json'
    config 'guaniao.mixins.json'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
            includeGroup('com.eliotlash.mclib')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
    implementation "com.eliotlash.mclib:mclib:20"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar.finalizedBy('reobfJar')

task sourceJar(type: Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allJava
}

artifacts {
    archives sourceJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact sourceJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// These regressions use main methods and need separate JVMs, not a JUnit engine.
def regressionTasks = fileTree('src/test/java').matching { include '**/*Test.java' }.files.sort().collect { source ->
    def className = file('src/test/java').toPath().relativize(source.toPath()).toString()
            .replace(File.separator, '.').replaceAll(/\.java$/, '')
    tasks.register("regression_${className.replace('.', '_')}", JavaExec) {
        group = 'verification'
        description = "Runs ${className}."
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = className
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
        workingDir = projectDir
        systemProperty 'java.awt.headless', 'true'
    }
}

tasks.register('regressionTest') {
    group = 'verification'
    description = 'Runs every standalone Java regression test in its own JVM.'
    dependsOn regressionTasks
}

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Checks version metadata and Mixin registration in the reobfuscated release JAR.'
    dependsOn 'reobfJar'
    doLast {
        def archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        new java.util.jar.JarFile(archive).withCloseable { jarFile ->
            def attributes = jarFile.manifest.mainAttributes
            if (attributes.getValue('Implementation-Version') != project.version.toString()) {
                throw new GradleException('Release JAR version does not match mod_version')
            }
            def configs = (attributes.getValue('MixinConfigs') ?: '').split(',')*.trim()
            if (!configs.contains('guaniao.mixins.json')) {
                throw new GradleException('Release JAR does not register guaniao.mixins.json')
            }
            def readJson = { String name ->
                def entry = jarFile.getJarEntry(name)
                if (entry == null) throw new GradleException("Release JAR is missing ${name}")
                jarFile.getInputStream(entry).withCloseable { stream ->
                    new groovy.json.JsonSlurper().parse(stream, 'UTF-8')
                }
            }
            def config = readJson('guaniao.mixins.json')
            def refmap = readJson(config.refmap)
            config.mixins.each { mixinName ->
                def classPath = "${config.package.replace('.', '/')}/${mixinName}"
                if (jarFile.getJarEntry("${classPath}.class") == null || !refmap.mappings[classPath]) {
                    throw new GradleException("Release JAR is missing the class or mappings for ${mixinName}")
                }
            }
            logger.lifecycle("Verified release JAR: ${archive.name}")
        }
    }
}

tasks.named('check') {
    dependsOn 'regressionTest', 'verifyReleaseJar'
}
