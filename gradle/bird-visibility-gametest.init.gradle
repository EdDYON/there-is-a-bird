// Run only this suite: gradlew --init-script gradle/bird-visibility-gametest.init.gradle runGameTestServer
// The visibility QA classes and fixture never enter the release jar.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def qa = p.sourceSets.create('visibilityQa') {
        java {
            srcDir(p.file('src/gametest/java'))
            include 'EdDYON/guaniao/content/bird/visibility/**'
        }
        resources {
            srcDir(p.file('src/gametest/resources'))
            include 'data/guaniao_visibility_qa/**'
        }
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + p.sourceSets.main.runtimeClasspath
    }
    p.minecraft.runs.gameTestServer {
        workingDirectory p.file('.tmp_bird_visibility/test-world')
        property 'forge.enabledGameTestNamespaces', 'guaniao_visibility_qa'
        property 'forge.logging.console.level', 'info'
        jvmArgs '-Xms512m', '-Xmx2G'
        mods { guaniao { source qa } }
    }
}
