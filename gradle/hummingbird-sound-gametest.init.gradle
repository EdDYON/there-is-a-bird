// Only hummingbird sound emission scenarios, including automatic level ticks.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def qa = p.sourceSets.create('hummingbirdSoundQa') {
        java {
            srcDir(p.file('src/gametest/java'))
            include 'EdDYON/guaniao/content/bird/hummingbird/HummingbirdSoundGameTests.java'
        }
        resources {
            srcDir(p.file('src/gametest/resources'))
            include 'data/guaniao_hummingbird_sound_qa/**'
        }
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + p.sourceSets.main.runtimeClasspath
    }
    p.minecraft.runs.gameTestServer {
        workingDirectory p.file('.tmp_hummingbird_sound/test-world')
        property 'forge.enabledGameTestNamespaces', 'guaniao_hummingbird_sound_qa'
        property 'forge.logging.console.level', 'info'
        jvmArgs '-Xms512m', '-Xmx2G'
        mods { guaniao { source qa } }
    }
}
