// Only the ground-placement and owner-head interaction scenarios are registered.
gradle.projectsEvaluated {
    def p = gradle.rootProject
    def qa = p.sourceSets.create('headPerchQa') {
        java {
            srcDir(p.file('src/gametest/java'))
            include 'EdDYON/guaniao/content/bird/headperch/**'
        }
        resources {
            srcDir(p.file('src/gametest/resources'))
            include 'data/guaniao_head_perch_qa/**'
        }
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + p.sourceSets.main.runtimeClasspath
    }
    p.minecraft.runs.gameTestServer {
        workingDirectory p.file('.tmp_head_perch/test-world')
        property 'forge.enabledGameTestNamespaces', 'guaniao_head_perch_qa'
        property 'forge.logging.console.level', 'info'
        jvmArgs '-Xms512m', '-Xmx2G'
        mods { guaniao { source qa } }
    }
}
